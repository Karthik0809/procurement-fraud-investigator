services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]

  # Uncomment on Day 4 when moving the relationship graph into Neo4j (see ROADMAP.md)
